name: Collecte quotidienne des articles

on:
  schedule:
    - cron: "0 5 * * *"  # Chaque jour à 7h Paris (UTC+2 été / UTC+1 hiver — conservatif)
  workflow_dispatch:      # Déclenchement manuel possible

jobs:
  fetch:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Run fetch_news.py
        env:
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
        run: |
          cd ${{ github.workspace }}
          python scripts/fetch_news.py

      - name: Commit and push if new articles
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add briefings/ memory.json
          git diff --staged --quiet || git commit -m "chore: collecte automatique $(date +%Y-%m-%d)"
          git push
