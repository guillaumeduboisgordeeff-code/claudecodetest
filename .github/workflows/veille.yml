name: Veille IA Gouvernance – Collecte hebdomadaire

on:
  schedule:
    # 6h15 UTC = 7h15 heure de Paris (hiver) / 8h15 (été)
    - cron: "15 6 * * 6"
  workflow_dispatch: # permet de lancer manuellement depuis GitHub

jobs:
  collecte:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configurer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installer les dépendances
        run: pip install -r scripts/requirements.txt

      - name: Collecter les articles de la semaine
        run: python scripts/fetch_news.py

      - name: Sauvegarder les résultats dans le dépôt
        run: |
          git config user.name "Veille Bot"
          git config user.email "bot@veille"
          git add briefings/ memory.json
          git diff --staged --quiet || git commit -m "Veille du $(date +'%Y-%m-%d')"
          git push
